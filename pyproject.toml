[tool.poetry]
name = "kalshi-chess-ingest"
version = "0.1.0"
description = "Kalshi chess markets and trades extract to BigQuery raw layer"
readme = "README.md"
authors = ["Kalshi Analytics <kamil.usmanov.es@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
requests = ">=2.31,<3"
